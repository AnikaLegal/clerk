### Virtual Host Config

# nginx's own error pages (below) don't pass through Django, so they miss the
# CORS headers Django adds. Without them, the browser hides the real status
# from the intake form (intake.anikalegal.org.au) and reports "Failed to fetch".
# Echo the Origin back on those pages only, for anikalegal.org.au sites.
# Never add this header to proxied responses: Django already sets it there,
# and browsers reject a response that has it twice.
map $http_origin $error_page_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*anikalegal\.org\.au$" $http_origin;
}

## Reverse proxy config 
server {
    # Clerk staging
    listen 80;
    listen [::]:80;
    server_name staging.anikalegal.org.au;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://127.0.0.1:8001 https://staging.anikalegal.org.au;
    }
    # Show maintenance pages
    error_page 502 503 =500 /maintenance.html;
    error_page 504 =500 /timeout.html;
    # Uploads over client_max_body_size
    error_page 413 /too-large.html;
    location = /maintenance.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
    location = /timeout.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
    location = /too-large.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
}
server {
    # Clerk prod
    listen 80;
    listen [::]:80;
    server_name anikalegal.org.au;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://127.0.0.1:8000 https://anikalegal.org.au;
    }
    # Show maintenance pages
    error_page 502 503 =500 /maintenance.html;
    error_page 504 =500 /timeout.html;
    # Uploads over client_max_body_size
    error_page 413 /too-large.html;
    location = /maintenance.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
    location = /timeout.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
    location = /too-large.html {
        root /srv/infra/nginx/pages;
        internal;
        add_header Access-Control-Allow-Origin $error_page_cors_origin always;
    }
}

## All other requests
server {
    # 404 random requests
    listen 80 default_server;
    server_name _;
    return 404;
}
