services:
  # Local development database.
  clerk_db:
    container_name: clerk_db
    image: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - clerk_postgres_data:/var/lib/postgresql
    ports:
      - 25432:5432
  # Django webserver.
  web:
    command: bash /app/scripts/web/local.sh
    image: clerk:local
    ports:
      - 8000:8000
      - 8123:8123 # Debug
    volumes:
      - ../app:/app
      - config_local:/root/.config
      - dist_local:/dist
    # Hide the host's app/.venv, which the bind mount above would otherwise
    # expose. Nothing in the container uses it (PATH points at /venv), but the
    # file watcher would walk ~9k files across the bind mount, and a host-side
    # `uv sync` would fire change events and restart the dev server.
    tmpfs:
      - /app/.venv
    links:
      - clerk_db
      - worker
      - css
      - frontend
      - intake
    env_file:
      - ../env/dev.env
    environment:
      - SHELLOPTS=vi
      - HISTFILE=/root/.config/bash_history
      - IPYTHON_DIR=/root/.config/ipython
  # Django-q worker.
  worker:
    command: bash /app/scripts/worker/local.sh
    image: clerk:local
    volumes:
      - ../app:/app
    tmpfs:
      - /app/.venv # Hide the host venv, as above
    links:
      - clerk_db
    env_file:
      - ../env/dev.env
  # Tailwind/DaisyUI watcher for Django web app styles.
  css:
    image: node:lts-slim
    working_dir: /app/web
    command: sh -c "npm ci && npm run watch"
    volumes:
      - ../app/web:/app/web
      - web_node_modules:/app/web/node_modules
      - dist_local:/dist
  frontend:
    image: clerk-frontend:local
    command: npm run dev
    ports:
      - 5173:5173
    volumes:
      - ../frontend/src:/frontend/src
      - ../frontend/vite.config.ts:/frontend/vite.config.ts
      - ../frontend/package.json:/frontend/package.json
  # Public intake form (SurveyJS SPA).
  intake:
    image: clerk-intake:local
    command: npm run dev
    ports:
      - 5174:5174
    volumes:
      - ../intake/src:/intake/src
      - ../intake/tests:/intake/tests
      - ../intake/vite.config.ts:/intake/vite.config.ts
      - ../intake/vitest.config.ts:/intake/vitest.config.ts
      - ../intake/tsconfig.json:/intake/tsconfig.json
      - ../intake/package.json:/intake/package.json
  # For testing.
  test:
    image: clerk:local
    volumes:
      - ../app:/app
    tmpfs:
      - /app/.venv # Hide the host venv, as above
    links:
      - clerk_db
    env_file:
      - ../env/test.env
volumes:
  clerk_postgres_data:
  web_node_modules:
  config_local:
  dist_local:
