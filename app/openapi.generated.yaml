openapi: 3.0.1
info:
  title: Clerk API
  description: API that the Django backend will provide.
  version: 0.1.0
paths:
  /api/submission/:
    post:
      operationId: createIntakeSubmission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeSubmissionCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/submission/{id}/:
    get:
      operationId: getIntakeSubmission
      parameters:
        - name: id
          description: Submission ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSubmission"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateIntakeSubmission
      parameters:
        - name: id
          description: Submission ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeSubmissionCreate"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/submission/{id}/submit/:
    post:
      operationId: submitIntakeSubmission
      parameters:
        - name: id
          description: Submission ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/submission/{id}/email-resume-link/:
    post:
      operationId: emailIntakeSubmissionResumeLink
      description: Email the submission's own resume link to the address it holds, so the user can pick the form up on another device. Requires an EMAIL answer.
      parameters:
        - name: id
          description: Submission ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/upload/:
    post:
      operationId: createIntakeUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                issue:
                  type: string
                  format: uuid
              required:
                - file
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeFileUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/webhooks/intake-noemail/:
    post:
      operationId: createIntakeNoEmailContact
      description: |
        Contact request from an intake user with no email address. Creates a WebflowContact (name and phone only), guarded by reCAPTCHA v3.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                phone:
                  type: string
                  minLength: 6
                  maxLength: 255
                captcha:
                  type: string
                  description: reCAPTCHA v3 token for the "intake_noemail" action.
              required:
                - name
                - phone
                - captcha
      responses:
        "201":
          description: Contact request created.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
  /clerk/api/submission/{id}/:
    get:
      operationId: getSubmission
      parameters:
        - name: id
          description: Submission ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /clerk/api/case/:
    get:
      operationId: getCases
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          required: false
        - name: page_size
          in: query
          schema:
            type: integer
          required: false
        - name: search
          in: query
          schema:
            type: string
          required: false
        - name: topic
          in: query
          schema:
            type: string
          required: false
        - name: stage
          in: query
          schema:
            type: string
          required: false
        - name: outcome
          in: query
          schema:
            type: string
          required: false
        - name: is_open
          in: query
          schema:
            type: string
          required: false
        - name: paralegal
          in: query
          schema:
            type: string
          required: false
        - name: lawyer
          in: query
          schema:
            type: string
          required: false
        - name: client
          in: query
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: number
                  next:
                    type: number
                    nullable: true
                  prev:
                    type: number
                    nullable: true
                  page_count:
                    type: number
                  item_count:
                    type: number
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                required:
                  - current
                  - next
                  - prev
                  - page_count
                  - item_count
                  - results
    post:
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/case/{id}/:
    get:
      operationId: getCase
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"
                  tenancy:
                    $ref: "#/components/schemas/Tenancy"
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/IssueNote"
                required:
                  - issue
                  - tenancy
                  - notes
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    patch:
      operationId: updateCase
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Successful response.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/case/{id}/note/:
    post:
      operationId: createCaseNote
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Successful response.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueNoteCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/case/{id}/docs/:
    get:
      operationId: getCaseDocuments
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharepoint_url:
                    type: string
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/SharepointDocument"
                required:
                  - sharepoint_url
                  - documents
  /clerk/api/case/{id}/services/:
    get:
      operationId: getCaseServices
      parameters:
        - name: id
          description: Entity ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ServiceCategory"
          required: false
        - name: type
          in: query
          schema:
            oneOf:
              - $ref: "#/components/schemas/ServiceTypeDiscrete"
              - $ref: "#/components/schemas/ServiceTypeOngoing"
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createCaseService
      parameters:
        - name: id
          description: Entity ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Successful response.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/case/{id}/services/{service_id}/:
    get:
      operationId: getCaseService
      parameters:
        - name: id
          description: Case ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: service_id
          description: Service ID
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    patch:
      operationId: updateCaseService
      parameters:
        - name: id
          description: Case ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: service_id
          description: Service ID
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        description: Request body for updating a case service.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    delete:
      operationId: deleteCaseService
      parameters:
        - name: id
          description: Case ID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: service_id
          description: Service ID
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/:
    get:
      operationId: getEmailThreads
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailThread"
  /clerk/api/email/{id}/create/:
    post:
      operationId: createEmail
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/{email_id}/:
    get:
      operationId: getEmail
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
    patch:
      operationId: updateEmail
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        description: Successful response.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailUpdate"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    delete:
      operationId: deleteEmail
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/{email_id}/attachment/:
    post:
      operationId: createEmailAttachment
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EmailAttachmentCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAttachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/{email_id}/attachment/{attachment_id}/:
    delete:
      operationId: deleteEmailAttachment
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
        - description: Email Attachment ID
          in: path
          name: attachment_id
          required: true
          schema:
            type: number
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/{email_id}/attachment/{attachment_id}/sharepoint/:
    post:
      operationId: uploadEmailAttachmentToSharepoint
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
        - description: Email Attachment ID
          in: path
          name: attachment_id
          required: true
          schema:
            type: number
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/email/{id}/{email_id}/attachment/sharepoint/{sharepoint_id}/:
    post:
      operationId: downloadEmailAttachmentFromSharepoint
      parameters:
        - description: Case ID
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - description: Email ID
          in: path
          name: email_id
          required: true
          schema:
            type: number
        - description: Sharepoint ID
          in: path
          name: sharepoint_id
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/note/:
    get:
      operationId: getNotes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          required: false
        - name: page_size
          in: query
          schema:
            type: integer
          required: false
        - name: issue
          description: Entity ID
          in: query
          schema:
            type: string
            format: uuid
          required: false
        - name: creator
          description: Creator account ID
          in: query
          schema:
            type: integer
          required: false
        - name: note_type
          in: query
          schema:
            $ref: "#/components/schemas/IssueNoteType"
          required: false
        - name: reviewee
          description: Reviewee account ID
          in: query
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: number
                  next:
                    type: number
                    nullable: true
                  prev:
                    type: number
                    nullable: true
                  page_count:
                    type: number
                  item_count:
                    type: number
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/IssueNote"
                required:
                  - current
                  - next
                  - prev
                  - page_count
                  - item_count
                  - results
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/person/:
    get:
      operationId: getPeople
      parameters:
        - name: query
          in: query
          schema:
            type: string
          required: false
        - name: page
          in: query
          description: Page number (pagination)
          schema:
            type: integer
          required: false
        - name: page_size
          in: query
          description: Number of items per page (pagination)
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: number
                  next:
                    type: number
                    nullable: true
                  prev:
                    type: number
                    nullable: true
                  page_count:
                    type: number
                  item_count:
                    type: number
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
                required:
                  - current
                  - next
                  - prev
                  - page_count
                  - item_count
                  - results
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    post:
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/person/{id}/:
    get:
      operationId: getPerson
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    patch:
      operationId: updatePerson
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: Successful response.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
    delete:
      operationId: deletePerson
      parameters:
        - description: Entity ID
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /clerk/api/date/:
    get:
      operationId: getCaseDates
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          required: false
        - name: page_size
          in: query
          schema:
            type: integer
          required: false
        - name: q
          in: query
          schema:
            type: string
          required: false
        - name: issue_id
          description: Entity ID
          in: query
          schema:
            type: string
            format: uuid
          required: false
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IssueDateType"
          required: false
