components:
  schemas:
    IntakeSubmissionCreate:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: true
      required:
        - answers
    IntakeSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        answers:
          type: object
          additionalProperties: true
          description: |
            Intake form answers keyed by UPPER_SNAKE_CASE question name. The effective schema is owned by the survey definition in intake/src/ and consumed by core.services.submission.process_submission.
      required:
        - id
        - answers
    Error:
      type: object
      description: |
        Standardized error envelope produced by drf-standardized-errors. Every 4xx/5xx response shares this shape: a `type` describing the error category and a list of one or more individual `errors`.
      properties:
        type:
          type: string
          description: The category of error that occurred.
          enum:
            - validation_error
            - client_error
            - server_error
          example: validation_error
        errors:
          type: array
          description: The individual errors that make up this response.
          items:
            type: object
            properties:
              code:
                type: string
                description: A machine-readable code identifying the error.
                example: required
              detail:
                type: string
                description: A human-readable description of the error.
                example: This field is required.
              attr:
                type: string
                nullable: true
                description: |
                  The name of the field that raised the error, or null for errors not tied to a specific field. Non-field validation errors use "non_field_errors".
                example: email
            required:
              - code
              - detail
              - attr
      required:
        - type
        - errors
    IntakeFileUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file:
          type: string
        issue:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - file
        - issue
    BooleanYesNo:
      type: object
      properties:
        label:
          type: string
          enum:
            - "Yes"
            - "No"
        value:
          type: boolean
      required:
        - label
        - value
    ChoiceDisplay:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
      required:
        - label
        - value
    SubmissionPerson:
      type: object
      properties:
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        support_contact_preferences:
          allOf:
            - $ref: "#/components/schemas/ChoiceDisplay"
          nullable: true
    SubmissionFiles:
      type: array
      items:
        type: object
        properties:
          url:
            type: string
          name:
            type: string
    SubmissionAnswers:
      type: object
      properties:
        client:
          type: object
          properties:
            first_name:
              type: string
              nullable: true
            last_name:
              type: string
              nullable: true
            preferred_name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            date_of_birth:
              type: string
              nullable: true
            phone_number:
              type: string
              nullable: true
            gender:
              type: string
              nullable: true
            centrelink_support:
              allOf:
                - $ref: "#/components/schemas/BooleanYesNo"
              nullable: true
            eligibility_notes:
              type: string
              nullable: true
            requires_interpreter:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            primary_language_non_english:
              allOf:
                - $ref: "#/components/schemas/BooleanYesNo"
              nullable: true
            primary_language:
              type: string
              nullable: true
            is_aboriginal_or_torres_strait_islander:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            number_of_dependents:
              type: integer
              nullable: true
            eligibility_circumstances:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            call_times:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            special_circumstances:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
        tenancy:
          properties:
            address:
              type: string
              nullable: true
            suburb:
              type: string
              nullable: true
            postcode:
              type: string
              nullable: true
            is_on_lease:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            rental_circumstances:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            start_date:
              type: string
              nullable: true
            landlord:
              allOf:
                - $ref: "#/components/schemas/SubmissionPerson"
              nullable: true
            agent:
              allOf:
                - $ref: "#/components/schemas/SubmissionPerson"
              nullable: true
        issue:
          properties:
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            weekly_income:
              type: integer
              nullable: true
            annual_income_range:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            employment_status:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            referrer:
              type: string
              nullable: true
            referrer_type:
              allOf:
                - $ref: "#/components/schemas/ChoiceDisplay"
              nullable: true
            weekly_rent:
              type: integer
              nullable: true
            support_worker:
              allOf:
                - $ref: "#/components/schemas/SubmissionPerson"
              nullable: true
        topic_specific:
          nullable: true
          properties:
            REPAIRS:
              type: object
              nullable: true
              properties:
                issue_start:
                  type: string
                  nullable: true
                issue_photos:
                  allOf:
