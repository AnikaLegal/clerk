</div>

<script type="text/javascript">
  const wrapper = document.querySelector('.our_partners')
  const viewport = wrapper.querySelector('.embla_viewport')
  const prevButton = wrapper.querySelector('.embla_prev_button')
  const nextButton = wrapper.querySelector('.embla_next_button')
  const dotsContainer = wrapper.querySelector('.embla_dots')
  const controls = wrapper.querySelector('.embla_controls')
  
  const autoplayOptions = { active: true, delay: 3000, playOnInit: true, stopOnInteraction: false, stopOnFocusIn: true, stopOnMouseEnter: true }
  const emblaAutoplay = EmblaCarouselAutoplay(autoplayOptions)
  const emblaApi = EmblaCarousel(viewport, { loop: true, align: 'start' }, [emblaAutoplay])
  
  prevButton.addEventListener('click', () => emblaApi.scrollPrev(), false)
  nextButton.addEventListener('click', () => emblaApi.scrollNext(), false)
  
  controls.addEventListener('mouseenter', () => {
    if (emblaAutoplay) emblaAutoplay.stop()
  })
  controls.addEventListener('mouseleave', () => {
    if (emblaAutoplay) emblaAutoplay.play()
  })
  
  // Dot elements logic (divs, not buttons)
  function createDot(index) {
    const dot = document.createElement('div')
    dot.className = 'embla_dot'
    dot.setAttribute('role', 'button')
    dot.setAttribute('tabindex', '0')
    dot.setAttribute('aria-label', `Go to slide ${index + 1}`)
    dot.addEventListener('click', () => emblaApi.scrollTo(index))
    dot.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        emblaApi.scrollTo(index)
      }
    })
    return dot
  }
  
  function updateDots() {
    const selectedIndex = emblaApi.selectedScrollSnap()
    Array.from(dotsContainer.children).forEach((dot, idx) => {
      if (idx === selectedIndex) {
        dot.classList.add('embla_dot--active')
      } else {
        dot.classList.remove('embla_dot--active')
      }
    })
  }
  
  function setupDots() {
    const slideCount = emblaApi.scrollSnapList().length
    dotsContainer.innerHTML = ''
    for (let i = 0; i < slideCount; i++) {
      dotsContainer.appendChild(createDot(i))
    }
    updateDots()
  }
  
  emblaApi.on('select', updateDots)
  emblaApi.on('init', setupDots)
  if (emblaApi) setupDots()
</script>
