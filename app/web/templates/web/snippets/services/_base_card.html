<div class="d-card basis-1/3 min-w-[350px] lg:max-w-[350px]">
  <figure class="rounded-tl-none rounded-tr-(--radius-box) rounded-bl-(--radius-box) rounded-br-none max-h-[250px] sm:max-h-none">
    <img src="{{ image_url }}" />
  </figure>
  <div class="d-card-body items-center">
    <div class="d-card-title">{{ title }}</div>
    <p>{{ description }}</p>
    <div class="d-card-actions justify-end w-full">
      <a class="grow" href="{{ url }}"><button class="d-btn d-btn-primary d-btn-wide d-btn-soft">Learn more</button></a>
    </div>
  </div>
</div>
