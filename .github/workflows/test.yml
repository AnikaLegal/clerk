name: Test
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

# A newer commit on the same branch cancels the older run, so an older build
# can never be pushed after a newer one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Check out GitHub repository
      - uses: actions/checkout@v4

      # Set the tags for the build: the environment tag that the Deploy
      # workflow pulls (prod for master, staging for everything else) and an
      # immutable sha tag that names this exact build.
      - name: Set tag names
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              echo "TAG=prod" >> "$GITHUB_ENV"
          else
              echo "TAG=staging" >> "$GITHUB_ENV"
          fi
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Setup transcrypt so that we can read secrets
      - name: Checkout transcrypt
        uses: actions/checkout@v4
        with:
          repository: elasticdog/transcrypt
          path: transcrypt

      - name: Initialise transcrypt
        run: ./transcrypt/transcrypt -c aes-256-cbc -p '${{ secrets.TRANSCRYPT_PASSWORD }}' --yes

      - name: Build frontend container image
        run: docker build -t clerk-frontend:local -f docker/Dockerfile.frontend .

      # Build the clerk Docker image so that we can run tests
      - name: Build container image
        run: docker build -t "anikalaw/clerk:${TAG}" -t "anikalaw/clerk:${SHA_TAG}" -f docker/Dockerfile .

      # Run clerk unit tests
      - name: Run unit tests
        run: docker compose -f docker/docker-compose.ci.yml run --rm test  pytest -vv

      # Publish the image the Deploy workflow will pull. Pull request runs only
      # test. Pushes to develop and master publish, as does running this
      # workflow manually on a branch, which is how a feature branch is put on
      # staging. success() is spelled out so the gate on the tests is explicit.
      - name: Login to DockerHub
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: anikalaw
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push container image
        if: success() && github.event_name != 'pull_request'
        run: |
          docker push "anikalaw/clerk:${TAG}"
          docker push "anikalaw/clerk:${SHA_TAG}"
