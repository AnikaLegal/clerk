name: Restore Check
on:
  workflow_dispatch:
  schedule:
    # Monthly, one hour after the nightly backup (2AM AEST).
    - cron: "0 17 1 * *"
# Runs share remote OpenTofu state, so only one may run at a time.
concurrency:
  group: restore-check
jobs:
  restore-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.12.x
        tofu_wrapper: false

    # The check runs on an ephemeral EC2 instance in our AWS account, so
    # production data never leaves our own infrastructure and the live
    # server is not involved at all. This runner only orchestrates and sees
    # the check summary. The EICE/subnet/security group variables are the
    # outputs of the infra/tofu/restore-check/foundations root.
    - name: Run restore check on an ephemeral instance
      id: check
      shell: bash
      run: ./infra/restore-check/run.sh
      env:
        AWS_ACCESS_KEY_ID: ${{ vars.RESTORE_CHECK_AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_CHECK_AWS_SECRET_ACCESS_KEY }}
        EICE_ID: ${{ vars.RESTORE_CHECK_EICE_ID }}
        SUBNET_ID: ${{ vars.RESTORE_CHECK_SUBNET_ID }}
        INSTANCE_SG_ID: ${{ vars.RESTORE_CHECK_INSTANCE_SG_ID }}
        CHECK_AWS_ACCESS_KEY_ID: ${{ vars.AWS_BACKUP_USER_ACCESS_KEY }}
        CHECK_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_USER_SECRET_ACCESS_KEY }}
        BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        S3_BUCKET: s3://anika-database-backups

    - name: Report results
      if: always()
      shell: bash
      run: |
        cat restore-check-summary.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || true
        ./infra/restore-check/report.sh
      env:
        OUTCOME: ${{ steps.check.outcome == 'success' && 'PASS' || 'FAIL' }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SLACK_WEBHOOK_URL: ${{ secrets.BACKUP_ALERTS_SLACK_WEBHOOK_URL }}
