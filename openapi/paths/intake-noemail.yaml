post:
  operationId: createIntakeNoEmailContact
  description: >
    Contact request from an intake user with no email address. Creates a
    WebflowContact (name and phone only), guarded by reCAPTCHA v3.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 255
            phone:
              type: string
              minLength: 6
              maxLength: 255
            captcha:
              type: string
              description: reCAPTCHA v3 token for the "intake_noemail" action.
          required:
            - name
            - phone
            - captcha
  responses:
    "201":
      description: Contact request created.
      content:
        application/json:
          schema:
            type: object
    "400":
      $ref: ../responses/BadRequest.yaml
