post:
  operationId: submitIntakeSubmission
  parameters:
    - name: id
      description: Submission ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
    "404":
      $ref: ../responses/NotFound.yaml
