post:
  operationId: emailIntakeSubmissionResumeLink
  description: >-
    Email the submission's own resume link to the address it holds, so the user
    can pick the form up on another device. Requires an EMAIL answer.
  parameters:
    - name: id
      description: Submission ID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
    "404":
      $ref: ../responses/NotFound.yaml
    "429":
      $ref: ../responses/TooManyRequests.yaml
