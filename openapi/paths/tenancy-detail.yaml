get:
  operationId: getTenancy
  parameters:
    - description: Entity ID
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../schemas/Tenancy.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
patch:
  operationId: updateTenancy
  parameters:
    - description: Entity ID
      in: path
      name: id
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    description: Request body for updating a tenancy.
    content:
      application/json:
        schema:
          $ref: ../schemas/TenancyUpdate.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../schemas/Tenancy.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
