get:
  operationId: getCallbacks
  description: The callbacks for one enquiry, newest first.
  parameters:
    - name: enquiry
      in: query
      schema:
        type: integer
      required: true
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schemas/Callback.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
post:
  operationId: createCallback
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/CallbackCreate.yaml
  responses:
    "201":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../schemas/Callback.yaml
    "400":
      $ref: ../responses/BadRequest.yaml
    "403":
      $ref: ../responses/PermissionDenied.yaml
