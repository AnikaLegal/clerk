description: The blacklist entry an enquiry matches.
type: object
properties:
  matched_on:
    type: array
    items:
      type: string
      enum:
        - PHONE
        - EMAIL
  name:
    type: string
    nullable: true
  reason:
    type: string
    nullable: true
  created_at:
    type: string
    format: date-time
  created_by_name:
    description: Who added the entry, if known.
    type: string
    nullable: true
required:
  - matched_on
  - name
  - reason
  - created_at
  - created_by_name
