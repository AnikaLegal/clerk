type: object
properties:
  first_name:
    type: string
  last_name:
    type: string
  email:
    type: string
    format: email
  url:
    type: string
    readOnly: true
  groups:
    type: array
    items:
      type: string
  is_intern:
    type: boolean
    default: false
required:
  - first_name
  - last_name
  - email
  - url
  - groups
