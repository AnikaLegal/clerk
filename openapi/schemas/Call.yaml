type: object
properties:
  id:
    type: integer
  created_at:
    type: string
    format: date-time
  modified_at:
    type: string
    format: date-time
  phone_number:
    type: string
  topic:
    type: string
  topic_display:
    type: string
  requires_callback:
    type: boolean
  number_callbacks:
    type: integer
  comments:
    type: string
  match:
    nullable: true
    allOf:
      - $ref: ./EnquiryMatch.yaml
  caller_name:
    type: string
  caller_email:
    type: string
  latest_callback:
    nullable: true
    allOf:
      - $ref: ./Callback.yaml
required:
  - id
  - created_at
  - modified_at
  - phone_number
  - topic
  - topic_display
  - requires_callback
  - number_callbacks
  - comments
  - match
  - caller_name
  - caller_email
  - latest_callback
