description: The client an enquiry came from, if they were already a client when it arrived.
type: object
properties:
  state:
    type: string
    enum:
      - OPEN_CASE
      - FORMER_CLIENT
  matched_on:
    type: array
    items:
      type: string
      enum:
        - PHONE
        - EMAIL
  client:
    type: object
    properties:
      full_name:
        type: string
      created_at:
        type: string
        format: date-time
      url:
        type: string
      contact_restriction:
        type: string
        nullable: true
        enum:
          - DO_NOT_CONTACT
          - DO_NOT_CONTACT_MARKETING
          - DO_NOT_CONTACT_ACTION_RESEARCH
          - null
      contact_restriction_display:
        type: string
        nullable: true
      contact_notes:
        type: string
    required:
      - full_name
      - created_at
      - url
      - contact_restriction
      - contact_restriction_display
      - contact_notes
  case:
    description: The open case, or the latest closed one for a former client.
    nullable: true
    type: object
    properties:
      fileref:
        type: string
      topic_display:
        type: string
      stage_display:
        type: string
      closed_at:
        description: When the case was last closed. Null if open, or closed before close events were recorded.
        type: string
        format: date-time
        nullable: true
      paralegal_name:
        type: string
        nullable: true
      url:
        type: string
    required:
      - fileref
      - topic_display
      - stage_display
      - closed_at
      - paralegal_name
      - url
required:
  - state
  - matched_on
  - client
  - case
