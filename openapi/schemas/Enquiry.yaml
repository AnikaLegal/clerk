description: Someone who got in touch by phone or through the website contact form.
type: object
properties:
  id:
    type: integer
  created_at:
    type: string
    format: date-time
  modified_at:
    type: string
    format: date-time
  source:
    $ref: ./EnquirySource.yaml
  source_display:
    type: string
  name:
    type: string
  email:
    type: string
  phone:
    type: string
  topic:
    description: Calls only. The option the caller picked in the phone menu.
    type: string
  topic_display:
    type: string
  referral:
    description: Contact form only. Answers saved before the question was removed.
    type: string
  requires_callback:
    type: boolean
  number_callbacks:
    type: integer
  comments:
    type: string
  match:
    nullable: true
    allOf:
      - $ref: ./EnquiryMatch.yaml
  latest_callback:
    nullable: true
    allOf:
      - $ref: ./Callback.yaml
required:
  - id
  - created_at
  - modified_at
  - source
  - source_display
  - name
  - email
  - phone
  - topic
  - topic_display
  - referral
  - requires_callback
  - number_callbacks
  - comments
  - match
  - latest_callback
