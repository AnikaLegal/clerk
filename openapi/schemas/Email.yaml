allOf:
  - $ref: ./EmailCreate.yaml
  - type: object
    properties:
      id:
        type: number
      issue:
        type: string
        format: uuid
      from_address:
        type: string
      created_at:
        type: string
      processed_at:
        type: string
        nullable: true
      sender:
        $ref: ./User.yaml
        nullable: true
      state:
        type: string
      reply_url:
        type: string
      edit_url:
        type: string
      attachments:
        type: array
        items:
          $ref: ./EmailAttachment.yaml
    required:
      - id
      - issue
      - from_address
      - created_at
      - processed_at
      - sender
      - state
      - reply_url
      - edit_url
      - attachments
